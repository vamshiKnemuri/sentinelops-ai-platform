{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sentinelops
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelops
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
