{{- $existing := lookup "v1" "Secret" .Release.Namespace "sentinelops-approval" -}}
apiVersion: v1
kind: Secret
metadata:
  name: sentinelops-approval
  labels:
    {{- include "sentinelops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  secret: {{ index $existing.data "secret" }}
  {{- else }}
  secret: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
