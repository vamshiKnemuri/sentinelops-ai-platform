apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelops-read-only
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelops-read-only
subjects:
  - kind: ServiceAccount
    name: sentinelops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinelops-read-only
