name: Bootstrap SentinelOps Project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore validated project
        env:
          PROJECT_ARCHIVE: ""
        run: |
          printf '%s' "$PROJECT_ARCHIVE" | base64 --decode > /tmp/sentinelops-project.tar.gz
          tar -xzf /tmp/sentinelops-project.tar.gz --strip-components=1
          rm -f .github/workflows/bootstrap-sentinelops.yml
      - name: Publish project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build SentinelOps AI incident response platform"
          git push
