name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and AI safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=sentinelops --cov-report=term-missing --cov-fail-under=80
      - run: python -m compileall -q src tests
      - run: python scripts/validate_project.py
      - run: python scripts/evaluate.py

  container:
    name: Container build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: sentinelops:test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinelops:test
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  platform:
    name: Terraform, Helm, and IaC security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
      - run: terraform fmt -check -recursive infrastructure/terraform
      - name: Initialize without remote state
        working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - name: Validate Terraform
        working-directory: infrastructure/terraform
        run: terraform validate
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint platform/chart --set image.repository=example.invalid/sentinelops --set image.tag=test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
